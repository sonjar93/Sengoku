<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>戦国シミュレータ</title>
<meta name="description" content="日本全国74か国を舞台にした、ブラウザで遊べる戦国シミュレーションゲーム。">
<meta name="theme-color" content="#22344a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#e4e8ec; --surface:#f5f6f7; --surface2:#dde3e9; --ink:#1b2430; --muted:#5d6874;
  --line:#b9c3cd; --indigo:#22344a; --gold:#a07a22; --danger:#a3312b; --ok:#2f6b4a;
  --sea:#c3d1de; --land:#f1efe8; --fog:#8e98a2; --lines-filter:none;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101820; --surface:#18232f; --surface2:#223040; --ink:#e6e9ec; --muted:#9aa6b2;
    --line:#33475b; --indigo:#0c141c; --gold:#d6b25e; --danger:#e0716a; --ok:#7cc59a;
    --sea:#13202b; --land:#2a3540; --fog:#4a5562; --lines-filter:invert(1) opacity(.75); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101820; --surface:#18232f; --surface2:#223040; --ink:#e6e9ec; --muted:#9aa6b2;
  --line:#33475b; --indigo:#0c141c; --gold:#d6b25e; --danger:#e0716a; --ok:#7cc59a;
  --sea:#13202b; --land:#2a3540; --fog:#4a5562; --lines-filter:invert(1) opacity(.75); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--indigo)}
h1,h2,h3{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,.prov:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:0 12px 96px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--indigo);color:#eef1f4;padding:8px 12px}
.bar-in{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.date{font-family:"Shippori Mincho B1",serif;font-size:18px;font-weight:800;letter-spacing:.04em}
.clanname{font-size:13px;opacity:.85}
.stats{display:flex;gap:10px;font-size:13px;flex-wrap:wrap;width:100%}
.stats b{font-weight:700;color:#f3dc9a}
.endturn{margin-left:auto;background:#a07a22;color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:700}
.endturn:disabled{opacity:.5}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
@media (max-width:420px){.tabs button{font-size:13px!important}}
.tabs button{background:none;border:0;padding:12px 0;font-size:14px;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-current="true"]{color:var(--ink);border-top-color:var(--gold);font-weight:700}
.mapbox{margin:12px 0 0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sea);position:relative;height:min(64vh,560px)}
.mapbox svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.mapbox svg:active{cursor:grabbing}
.app-map{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;overflow:hidden}
.app-map header.bar{position:relative;top:0}
.mapmain{flex:1;min-height:0;position:relative;margin-bottom:calc(50px + env(safe-area-inset-bottom,0px))}
.stage{position:absolute;inset:0;display:flex}
.stage .mapbox{flex:1;height:100%;margin:0;border:0;border-radius:0}
.side{background:var(--surface);overflow:auto;overscroll-behavior:contain}
.side .panel{margin:0;border:0;border-radius:0;border-bottom:1px solid var(--line)}
.sheet-handle{display:none}
.grp{font-size:13px;color:var(--muted);margin:12px 0 0;font-family:inherit;font-weight:700}
.clanbox{background:var(--surface2);border-radius:8px;padding:8px 10px;margin:8px 0}
@media (min-width:860px){.side{width:400px;border-left:1px solid var(--line)}}
@media (max-width:859px){
  .side{position:absolute;left:0;right:0;bottom:0;max-height:52%;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.18);z-index:3}
  .side.mini{max-height:118px;overflow:hidden}
  .sheet-handle{display:flex;justify-content:center;width:100%;background:none;border:0;padding:8px 0 2px;position:sticky;top:0;z-index:1;background:var(--surface)}
  .sheet-handle span{width:44px;height:5px;border-radius:3px;background:var(--line)}
  .stage .mapctl{bottom:auto}
}
.goalbtn{position:relative;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:6px;padding:7px 12px;font:inherit;font-weight:700;cursor:pointer;margin-left:auto}
.goalbtn+.endturn{margin-left:0}
.savebtn{margin-left:auto;margin-right:6px}
.savebtn+.goalbtn{margin-left:0}
@media (max-width:420px){.goalbtn{padding:7px 8px}}
.goalbtn .gcount{color:#f3dc9a!important}
.goalbtn .badge{position:absolute;top:-6px;right:-6px;background:#d0342c;color:#fff;border-radius:9px;font-size:11px;padding:0 5px;line-height:17px}
.goalbtn .gcount{margin-left:4px;font-size:11px;color:var(--muted)}
#chat{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;justify-content:flex-end}
#chat .chatbox{background:var(--surface);width:min(460px,100%);height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.chathead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.goallist{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-bottom:8px;max-height:30%;overflow:auto}
.goalrow{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;padding:3px 0}
.chatlog{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.msg{max-width:88%;padding:8px 10px;border-radius:10px;font-size:14px}
.msg small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.msg.sys{background:var(--surface2);align-self:flex-start}
.msg.me{background:#a6e22e33;align-self:flex-end}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.chips .chip{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit;font-size:12px}
.chatin{display:flex;gap:6px}
.chatin input{flex:1;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,.pickrow,.btn{touch-action:manipulation}
@media (max-width:859px){input,textarea,select{font-size:16px!important}}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl .btn{padding:6px 10px;min-width:44px;background:var(--surface);opacity:.92}
.prov{cursor:pointer;outline:none}
.lbl{font-family:"Shippori Mincho B1",serif;font-weight:800;pointer-events:none}
.mapimg{filter:var(--lines-filter);pointer-events:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.panel h2{margin:0 0 4px;font-size:20px}
.sub{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 14px;margin:10px 0}
.kv{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:2px 0}
.kv span:first-child{color:var(--muted)}
.cmds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--indigo);color:#eef1f4;border-color:var(--indigo)}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.ai{border-color:var(--gold)}
.cost{font-size:11px;color:var(--muted);margin-left:4px}
.btn.primary .cost{color:#c9d1da}
.section-title{font-size:16px;margin:18px 0 6px}
.list{display:flex;flex-direction:column;gap:6px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.row .name{font-weight:700;min-width:6em}
.row .meta{font-size:12px;color:var(--muted)}
.row .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.bad{border-color:var(--danger);color:var(--danger)}
.chip.good{border-color:var(--ok);color:var(--ok)}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:4px}
.log{list-style:none;padding:0;margin:0}
.log li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log time{color:var(--muted);font-size:12px;margin-right:6px}
.note{font-size:13px;color:var(--muted)}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.tblwrap{overflow-x:auto}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(8,12,18,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.overlay{align-items:center}}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:580px;max-height:86vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{border-radius:14px}}
.modal h3{margin:0 0 8px;font-size:19px}
.modal .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pickrow{width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:6px;display:block}
.pickrow:disabled{opacity:.45}
.pickrow small{display:block;color:var(--muted)}
.speech{background:var(--surface2);border-left:4px solid var(--gold);border-radius:6px;padding:12px;margin:10px 0;font-family:"Shippori Mincho B1",serif;font-size:16px;line-height:1.8;white-space:pre-wrap}
.speech.me{border-left-color:var(--indigo)}
.speaker{font-weight:700}
.warnbox{border:1px solid var(--danger);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px;color:var(--danger)}
.okbox{border:1px solid var(--ok);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px;color:var(--ok)}
select{width:100%;padding:8px;margin-top:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input[type=checkbox]{width:18px;height:18px;vertical-align:-3px;accent-color:var(--gold)}
input[type=text],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--indigo);color:#eef1f4;padding:10px 16px;border-radius:8px;font-size:14px;max-width:90vw}
.loading{position:fixed;inset:0;z-index:40;background:rgba(8,12,18,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Shippori Mincho B1",serif;font-size:18px;text-align:center;padding:20px}
.title{padding:40px 0 20px}
.title h1{font-size:40px;line-height:1.15;margin:0;letter-spacing:.06em}
.title p{color:var(--muted)}
.scen{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:8px;padding:14px;margin:10px 0}
.scen strong{font-family:"Shippori Mincho B1",serif;font-size:18px;display:block}
.ken-clan{font-weight:700;margin-top:10px}
.ken-item{font-size:14px;padding:4px 0 4px 10px;border-left:3px solid var(--line);margin:4px 0}
.ken-item.rumor{color:var(--muted);font-style:normal}
.ken-item.big{border-left-color:var(--danger)}
.ordrow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line);font-size:14px}
.ordrow span{flex:1}
</style>
</head>

function addOrder(o){o.clan=o.clan||S.player;S.orders.push(o);const c=S.clans[o.clan];c.ap-=o.ap;if(o.gid)S.gens[o.gid].used=true;if(o.gold)c.gold-=o.gold;if(o.rice)c.rice-=o.rice;if(o.n)c.committed+=o.n}

function orderLabel(o){
  const g=o.gid?S.gens[o.gid].name+'：':'';
  if(o.type==='naisei')return `${g}${PROVS[o.pid].n}で${NAISEI[o.k].l}`;
  if(o.type==='fort')return `${g}${PROVS[o.pid].n}に${PROVS[o.face].n}口の砦を築く`;
  if(o.type==='attack')return `${g}兵${fmt(o.n)}で${PROVS[o.to].n}へ出陣${o.allies&&o.allies.length?'（加勢を依頼）':''}`;
  if(o.type==='dip')return `${g}${DIPN[o.sub]}（${o.sub==='poach'?S.gens[o.target].name:o.sub==='choryaku'?PROVS[o.target].n:S.clans[o.target].name}）${o.letter?'・書状':''}`;
  if(o.type==='recruit')return `${g}${S.gens[o.target].name}の登用${o.letter?'・書状':''}`;
  if(o.type==='donate')return o.pardon?'朝廷へ赦免を願う':'朝廷へ献金';
  if(o.type==='rank')return '官位を申請';
  if(o.type==='petition')return `${S.clans[o.target].name}を朝敵とするよう奏上`;
  if(o.type==='gonaisho')return `${S.clans[o.vassal].name}に${PROVS[o.to].n}攻めを命じる（御内書）`;

/* ========== 月末処理 ========== */
async function endTurn(){
  if(busy||S.over)return;busy=true;render();
  try{
    goalPlan();
    delegatePlan();
    for(const c of Object.keys(S.clans))if(c!==S.player&&S.clans[c].alive&&!S.clans[c].neutral)aiPlan(c);
    coalitionStrike();
    const threats=S.orders.filter(o=>o.type==='attack'&&o.clan!==S.player&&S.provs[o.to].owner===S.player);
    for(const o of threats)await defenseDecision(o);
    const pleas=S.orders.filter(o=>{if(o.type!=='attack'||o.clan===S.player)return false;const d=S.provs[o.to].owner;return d!==S.player&&d!=='kokushu'&&rel(S.player,d).ally&&!isAlly(o.clan,S.player)});
    for(const o of pleas)await allyPlea(o);
    if(S.campaign){const dor=S.orders.find(o=>o.type==='attack'&&o.to==='yamashiro'&&opposed(o.clan,S.provs.yamashiro.owner));const ps=sideOf(S.player);if(dor&&(ps==='loyal'||ps==='rebel')&&dor.clan!==S.player&&S.provs.yamashiro.owner!==S.player)await decisiveDecision(dor)}
  }catch(e){console.error(e)}
  const ld=h('div',{class:'loading',role:'status'},'月末の処理中…');document.body.append(ld);
  try{
    const letters=S.orders.filter(o=>o.letter&&o.clan===S.player);
    if(letters.length||S.names.length)ld.textContent=aiOn()?'使者の帰りを待っています…':'月末の処理中…';
    await Promise.all(letters.map(o=>letterReply(o)));
    await Promise.all(S.names.map(n=>judgeName(n)));
    resolveAll();
    if(S.delegN){S.reports.push({t:`委任した国で、城代たちが${S.delegN}件の内政を行った。`});S.delegN=0}
    monthEnd();
    goalReview();
    save('auto');
  }catch(e){console.error(e)}finally{ld.remove();busy=false}
  save('auto');render();digest();
}

  const choice=o.letter?'書':o.choice;
  const extra=(choice==='脅'?threat:0)+(o.ai?clamp(o.ai.score|0,-20,20):0);
  const p=chance(base,choice,who.pers,g?g.chi:50,extra);
  let kind=roll(p,choice,who.pers);
  if(o.letter&&kind==='anger')kind='refuse';
  if(o.letter&&o.ai&&o.ai.score<=-12&&kind==='refuse')kind='anger';
  let line=LINES[kind][who.pers];
  if(o.ai){const t=kind==='accept'?o.ai.accept:kind==='waver'?o.ai.waver:o.ai.refuse;if(t)line=t}
  return {kind,line,p};
}

  }

  }else{

  }
  return {mine:back(who,r,res,r.kind==='accept'),ken};
}

function nameLevel(name,cid){const tol=nameTol(cid),k=S.court;const own=new Set(Object.keys(OWN_W).filter(x=>k[x]===cid).flatMap(x=>OWN_W[x]));let lv=0;const hit=[];

/* ========== 敵AI ========== */
function aiPlan(cid){

    if(c.ap>=3&&!(S.kinHold||{})[cid]&&(S.turn||0)>=4&&!S.orders.some(o=>o.clan===cid&&o.type==='attack')&&Math.random()<(coalMember(cid)?.6:P().choteki&&neighborClans(S.player).includes(cid)?.6:(S.campaign&&sideOf(cid)&&sideOf(cid)!=='neutral'?.5:.25))&&!(cid==='ashikaga'&&Math.random()<.7)){let t=aiTarget(cid,L);if(t&&peaceBlocks(cid,S.provs[t.to].owner)){const LL=leaderOf(cid);if(!(LL&&(LL.pers==='野'||LL.pers==='血')&&Math.random()<.1))t=null}if(t){const morale=c.rice>=t.n/10?1:.8;
      const allies=Object.keys(S.clans).filter(al=>al!==cid&&al!==S.player&&S.clans[al].alive&&!S.clans[al].neutral&&isAlly(al,cid)&&!isAlly(al,S.provs[t.to].owner)&&PROVS[t.to].adj.some(q=>S.provs[q].owner===al));
      addOrder({clan:cid,type:'attack',to:t.to,n:t.n,ap:3,rice:Math.min(c.rice,Math.ceil(t.n/10)),morale,allies});continue}}
    const ps=provsOf(cid);if(!ps.length)break;
    if(c.ap>=2&&c.gold>=450&&Math.random()<.12&&!S.orders.some(o=>o.clan===cid&&o.type==='fort')){
      const cand=[];for(const p of ps)for(const q of PROVS[p].adj){const o=S.provs[q].owner;if(o!==cid&&!isAlly(o,cid)&&!(S.provs[p].forts||[]).includes(q)&&(S.provs[p].forts||[]).length<2)cand.push([p,q,o==='kokushu'?0:S.clans[o].troops])}
      if(cand.length){cand.sort((a,b)=>b[2]-a[2]);const [p,q]=cand[0];addOrder({clan:cid,type:'fort',pid:p,face:q,ap:2,gold:250});continue}
    }
    const p=pick(ps),Q=S.provs[p];let k;
    const ch=S.orders.filter(o=>o.clan===cid&&o.k==='chohei').length;
    if(c.troops<troopCap(cid)*.8&&c.gold>=100&&ch<(c.troops<troopCap(cid)*.4?2:1))k='chohei';
    else if(Q.loy<45&&c.rice>300)k='hodokoshi';
    else if(Q.castle<70&&c.gold>=120&&Math.random()<.3)k='fushin';
    else if(c.gold<100&&S.provs[p].loy>55&&Math.random()<.3)k='nengu';
    else if(SPECIAL[p]&&(S.provs[p].dev||0)<3&&c.gold>=300&&Math.random()<.25)k='dev';
    else k=Math.random()<.5?'kaikon':'shogyo';
    const N=NAISEI[k];addOrder({clan:cid,type:'naisei',k,pid:p,ap:1,gold:N.gold||0,rice:N.rice||0});
  }
  const pc=S.player;
  if(c.vassalOf==null&&neighborClans(pc).includes(cid)&&!isAlly(cid,pc)&&!P().choteki){const r=rel(cid,pc);if(r.friend>=40&&c.troops<P().troops&&Math.random()<.07)S.events.push({type:'offer',from:cid})}
  if(Math.random()<.02){const others=Object.keys(S.clans).filter(o=>o!==cid&&o!==pc&&S.clans[o].alive&&!S.clans[o].neutral&&!isAlly(o,cid));if(others.length){const o=pick(others);rel(cid,o).ally=true;rel(cid,o).friend+=15;S.pendingKen=(S.pendingKen||[]);S.pendingKen.push({clan:cid,text:`${c.name}と${S.clans[o].name}が同盟を結んだ。`,big:true})}}
}
function aiTarget(cid,g){
  const c=S.clans[cid];let best=null;const free=avail(cid);if(free<1500)return null;
  const n=Math.round(free*.65);

    const Q=S.provs[q],o=Q.owner;if(o===cid)continue;
    if(o!=='kokushu'&&(isAlly(cid,o)||truceLeft(cid,o)>0))continue;
    const dg=defGeneral(o,q);const field=o==='kokushu'?Q.kt:defField(o);
    const ratio=n*(1+g.tou/100)/(Math.max(1,field)*(1+(dg?dg.tou:40)/100)*(1+Q.castle/100));
    let need=1.45;if(o===S.player&&P().choteki)need=1.1;if(hasTaigi(cid,o))need-=.1;if(opposed(cid,o))need-=.25;if(regionTaigi(cid,q))need-=.1;if(coalMember(cid)&&inRealm(o))need-=.35;if(S.campaign&&sideOf(cid)==='loyal'&&opposed(cid,o)){if(S.campaign.focus===q)need-=.4;if((S.campaign.urged||{})[cid]>0)need-=.15}if(o==='ashikaga'&&S.court.shogun==='ashikaga'&&!opposed(cid,o)&&!hasTaigi(cid,o))need+=.6;

}

function applyPenalties(pen,o){

  if(pen.includes('ally')){c.court-=15;for(const x of others)rel(S.player,x).friend-=15;for(const g of gens)if(g.pers==='義')g.loyal-=10;const r=rel(S.player,o);r.ally=false;r.marriage=false;if(S.clans[o].vassalOf===S.player)S.clans[o].vassalOf=null}

  if(S.orders.some(o=>o.type==='attack'&&o.to===to&&o.clan===S.player)){toast('この国にはすでに出陣を命じています');return}
  const free=avail(S.player);if(free<300){toast('動かせる兵がいません');return}
  const rules=attackRules(to);
  if(rules.block){modal('出陣できません',h('p',null,rules.block),[['閉じる',closeModal]]);return}
  const opts=[.2,.4,.6,.8,1].map(r=>r===1?free:Math.round(free*r/100)*100);
  const inp=h('input',{type:'number',min:'100',max:String(free),step:'100',value:String(Math.max(100,Math.round(free*.6/100)*100)),inputmode:'numeric','aria-label':'出陣する兵数',style:'width:8em;font:inherit;padding:6px;margin:0 6px'});

      h('div',{class:'cmds',style:'align-items:center'},h('label',{class:'note',style:'margin:0'},'兵数を入力',inp),h('button',{class:'btn primary',onclick:go},'この兵数で出陣'))),null,
    h('div',{class:'actions'},opts.map((v,i)=>v>=100?h('button',{class:'btn'+(i===4?' warn':''),onclick:()=>{closeModal();step(v)}},['2割','4割','6割','8割','全軍'][i]+' '+fmt(v)):null),h('button',{class:'btn',onclick:closeModal},'やめる')));
  function step(n){
    const o=S.provs[to].owner,need=Math.ceil(n/10),morale=P().rice>=need?1:.8;
    const allies=Object.keys(S.clans).filter(al=>al!==S.player&&al!==o&&S.clans[al].alive&&!S.clans[al].neutral&&isAlly(al,S.player)&&(o==='kokushu'||!isAlly(al,o))&&PROVS[to].adj.some(q=>S.provs[q].owner===al));
    const cb=allies.length?h('input',{type:'checkbox'}):null;if(cb)cb.checked=true;
    const body=h('div',null,
      h('p',null,`兵${fmt(n)}で${S.provs[to].cname}（${S.clans[o].name}）を攻めます。合戦は月末に行われ、結果は翌月に届きます。兵糧${fmt(need)}を使います。`),
      cb?h('label',{class:'note',style:'display:block;margin:8px 0'},cb,` 同盟国（${allies.map(a=>S.clans[a].name).join('・')}）に加勢を頼む`):null,
      morale<1?h('div',{class:'warnbox'},'兵糧が足りず、士気が下がります。'):null,
      rules.free?h('div',{class:'okbox'},'朝敵の身ゆえ、大義も勅命も気にせず攻められる。'):null,
      rules.w.map(t=>h('div',{class:'warnbox'},t)));

  }

function orderDip(sub,target){
  if(!needAP(2))return;

  let who=null,base=30,threat=0;
  if(sub==='choryaku')who=Object.values(S.gens).find(x=>x.clan==='kokushu'&&x.home===target&&x.status==='active')||null;
  else who=leaderOf(target);
  const r0=sub==='choryaku'?null:rel(S.player,target);
  if(sub==='alliance'){base=10+r0.friend/2-(P().choteki?25:0)+P().rank*3;threat=threatOf(target)}
  if(sub==='marriage')base=30+r0.friend/3+P().rank*3;
  if(sub==='vassal'){base=-25+(P().troops/Math.max(1,S.clans[target].troops)-1)*30+r0.friend/5;threat=threatOf(target)}

    addOrder({type:'dip',sub,target,ap:2,gold:a.gold||0,choice:a.choice,letter:a.letter});
    toast('使者を送り出した（結果は翌月）');render();
  },{who,base,threat});

  const estDef=q=>{const o=S.provs[q].owner;if(o==='kokushu')return S.provs[q].kt;const v=visible(q)?defField(o):S.clans[o].troops*.6;return v*(1+S.provs[q].castle/100)};
  const attackToward=(g,targets)=>{

      case 'office':{const need=officeNeed(g.kind,S.player,false,true);g.note=need||'';
        if(!need){if(!S.orders.some(o=>o.type==='office')&&c.ap>=2){const gold=officeCost(g.kind);addOrder({type:'office',kind:g.kind,ap:2,gold,goal:g.id});done.push(`${OFFICE[g.kind]}への任官の願い`)}}

        else if(/金/.test(need)){for(const p of provsOf(S.player))if(S.provs[p].loy>=65&&(S.turn-(S.provs[p].lastNengu||-9))>=3&&c.ap>=1){if(nai(p,'nengu',g))S.provs[p].lastNengu=S.turn}}

/* ========== 家臣団・委任・独立 ========== */
const POLICY={dev:'開発',mil:'軍備',civ:'民政',bal:'均衡'};
function rets(){if(!S.retainers)S.retainers=[];if(!S.deleg)S.deleg={};return S.retainers}
function genRetainer(){const used=new Set(rets().map(r=>r.name).concat(Object.values(S.gens).map(g=>g.name)));let name,t=0;do{name=pick(NH_SUR)+pick(NH_GIV)}while(used.has(name)&&t++<60);S.retN=(S.retN||0)+1;
  return {id:'rt'+S.retN,name,tou:Math.round(rnd(45,88)),bu:Math.round(rnd(45,88)),chi:Math.round(rnd(45,88)),sei:Math.round(rnd(45,88)),pers:pick(['義','野','慎','血','温']),prov:null,born:Math.round(S.year-rnd(20,45))}}
function retCap(){return provsOf(S.player).length+3}
function retOf(pid){return rets().find(r=>r.prov===pid)}
function retLine(r){return `${r.past&&r.past.length>1?'旧'+r.past.slice(0,-1).join('・')+'　':''}${r.ichimon?'一門　':''}${r.died&&lifeMode()==='hist'?'（史実'+r.died+'年没）':''}${r.born?(S.year-r.born)+'歳　':''}統${r.tou} 武${r.bu} 知${r.chi} 政${r.sei}　${PERS[r.pers]}`}

  pickList('召し抱える者（金300）',cs.map(r=>({label:r.name,sub:retLine(r),value:r})),r=>{if(P().gold<300)return;P().gold-=300;rets().push(r);log(`${r.name}を召し抱えた。`);toast(`${r.name}が家臣に加わった`);render()},'城代として国を任せれば、毎月その国の内政を代わりに行います（行動力は使いません）。政治の高い者は開墾も手早く進めます。');}
function doDaikan(p){const rs=rets();if(!rs.length){toast('家臣がいません。当主タブで召し抱えてください');return}
  pickList(`${PROVS[p].n}の城代`,rs.map(r=>({label:r.name+(r.prov===p?'（現任）':''),sub:retLine(r)+(r.prov&&r.prov!==p?`　現在：${PROVS[r.prov].n}の城代`:''),value:r.id})),id=>{for(const r of rs)if(r.prov===p)r.prov=null;const r=rs.find(x=>x.id===id);r.prov=p;if(!S.deleg[p])S.deleg[p]='bal';toast(`${r.name}を${PROVS[p].n}の城代にした（委任：${POLICY[S.deleg[p]]}）`);render()},'城代を置くと、その国は「均衡」の方針で委任されます。方針は国の画面で変えられます。');}
function delegateAll(){const rs=rets();const free=rs.filter(r=>!r.prov||S.provs[r.prov].owner!==S.player);for(const r of free)r.prov=null;
  for(const p of provsOf(S.player)){if(p===P().capital)continue;if(!retOf(p)){const r=rs.find(x=>!x.prov);if(!r)break;r.prov=p}if(retOf(p)&&!S.deleg[p])S.deleg[p]='bal'}
  toast('本拠以外の国を城代に委任した');render()}
function delegatePlan(){const c=P();rets();let n=0;
  for(const r of S.retainers)if(r.prov&&(!S.provs[r.prov]||S.provs[r.prov].owner!==S.player))r.prov=null;
  for(const p of Object.keys(S.deleg)){const Q=S.provs[p],rt=retOf(p);if(!Q||Q.owner!==S.player||!rt){delete S.deleg[p];continue}
    if(S.orders.some(o=>o.clan===S.player&&o.pid===p&&o.type==='naisei'))continue;
    const pol=S.deleg[p],cap=troopCap(S.player),can=x=>{const N=NAISEI[x];return c.gold-(N.gold||0)>=150&&c.rice-(N.rice||0)>=200};
    const grow=Q.koku<Q.base*1.6?'kaikon':'shogyo';let k;
    if(pol==='dev')k=SPECIAL[p]&&(Q.dev||0)<3&&can('dev')?'dev':grow;
    else if(pol==='mil')k=c.troops<cap*.95&&Q.loy>40&&can('chohei')?'chohei':Q.castle<110&&can('fushin')?'fushin':grow;
    else if(pol==='civ')k=Q.loy<80&&can('hodokoshi')?'hodokoshi':'shogyo';
    else k=Q.loy<50&&can('hodokoshi')?'hodokoshi':c.troops<cap*.7&&can('chohei')?'chohei':(S.turn%2?'kaikon':'shogyo');
    if(!can(k))k=grow;
    const N=NAISEI[k];addOrder({type:'naisei',k,pid:p,ap:0,gold:N.gold||0,rice:N.rice||0,by:rt.id});n++;
    if(rt.sei>=78&&k!=='kaikon'&&Q.koku<Q.base*1.6){addOrder({type:'naisei',k:'kaikon',pid:p,ap:0,by:rt.id});n++}}
  S.delegN=n}
